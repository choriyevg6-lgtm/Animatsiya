<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  .stage { position:relative; width:100%; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .name-wrap { height:90px; flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:18px; }
  .name-text {
    font-family:'Segoe Script','Brush Script MT',cursive; font-style:italic; font-weight:700;
    font-size:clamp(40px,10vw,78px); white-space:nowrap; color:#ff5fa2;
    text-shadow:0 0 18px rgba(255,95,162,0.75),0 0 34px rgba(192,132,252,0.5);
    clip-path: inset(0 100% 0 0); animation: reveal 6600ms linear forwards;
  }
  @keyframes reveal { to { clip-path: inset(0 0% 0 0); } }
  canvas { display:block; flex-shrink:0; }
</style>
</head>
<body>
<div class="stage">
  <div class="name-wrap"><div class="name-text">Murodjon</div></div>
  <canvas id="c"></canvas>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = Math.max(window.innerHeight - 108, 300); }
resize();
window.addEventListener('resize', resize);
const cx = () => canvas.width / 2;
const cy = () => canvas.height / 2 + 20;
const colors = ["#ff3b3b","#3b82ff","#39ff6a","#fff23b","#3bfff2","#ff3bf2","#ff9a3b","#ff8fd0"];
const scale = 12, totalPoints = 120, STEP_DELAY = 55;
let i = 0;
function drawStarBurst(x,y,color){
  ctx.strokeStyle = color; ctx.lineWidth = 1.5;
  let angle = 0;
  for (let k=0;k<8;k++){
    const rad = angle*Math.PI/180;
    const nx = x+Math.cos(rad)*6, ny = y+Math.sin(rad)*6;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
    angle += 45;
  }
}
function step(){
  if (i >= totalPoints) return;
  const angle = i*(Math.PI*2)/totalPoints;
  const x = 16*Math.pow(Math.sin(angle),3);
  const y = 13*Math.cos(angle) - 5*Math.cos(2*angle) - 2*Math.cos(3*angle) - Math.cos(4*angle);
  const px = cx()+x*scale, py = cy()-y*scale;
  const color = colors[Math.floor(Math.random()*colors.length)];
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx(),cy()); ctx.lineTo(px,py); ctx.stroke();
  drawStarBurst(px,py,color);
  i++; setTimeout(step, STEP_DELAY);
}
step();
</script>
</body>
</html>
